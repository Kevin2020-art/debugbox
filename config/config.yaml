# 工业远程调试伴侣盒配置文件 (Debug Box Configuration)

hardware:
  button_pin: 17             # 网络重置按键 GPIO (Pin 11)，另一端接 GND
  led_pin: 27                # 状态指示灯 GPIO (Pin 13)，串联 330 欧姆电阻到 GND
  long_press_seconds: 3.0    # 触发重置的长按判定时间 (秒)
  debounce_time: 0.05        # 按键去抖动时间 (秒)

wifi:
  interface: "wlan0"         # 树莓派无线网卡名
  ap_ssid_prefix: "DebugBox" # 热点名称前缀，后接MAC后4位，如: DebugBox-A1B2
  ap_password: ""            # 热点密码（空表示免密，方便工人直接连入）
  ap_ip: "192.168.4.1"       # 热点模式下的静态IP
  ap_subnet: "24"
  portal_port: 80            # 手机配网网页服务端口 (默认 80，工人连上后免输端口)
  connect_timeout: 25        # 尝试连接工厂 Wi-Fi 的超时时间 (秒)

system:
  log_dir: "/var/log/debugbox"
  status_check_interval: 5   # 网络状态轮询间隔 (秒)

easytier:
  enabled: true
  network_name: "debugbox_mesh"
  network_secret: "debugbox_pass_2026"
  ipv4: "10.144.144.2"       # 树莓派虚拟内网 IP
  peer_node: "tcp://public.easytier.top:11010"

# 多串口监控通道配置说明 (可通过 debugbox-serial@<通道名>.service 独立运行)
serial_channels:
  uart1:
    device: "/dev/target_uart1"  # 树莓派物理 USB 端口 1 (USB 2.0 上口)
    baud: 115200                 # 默认主控 CPU 调试串口波特率
    description: "SoC Linux Debug Console"
  uart2:
    device: "/dev/target_uart2"  # 树莓派物理 USB 端口 2 (USB 2.0 下口)
    baud: 115200                 # MCU/单片机遥测串口波特率
    description: "MCU Telemetry Console"
  uart3:
    device: "/dev/target_uart3"  # 树莓派物理 USB 端口 3 (USB 3.0 上口)
    baud: 9600                   # 传感器 / 4G 模组串口波特率
    description: "Sensor / 4G Modem Console"
  uart4:
    device: "/dev/target_uart4"  # 树莓派物理 USB 端口 4 (USB 3.0 下口)
    baud: 115200                 # 备用串口
    description: "Auxiliary Console"

